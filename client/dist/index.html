<!-- Cormorant Garamond for the titles and the written pages, Jost for the
     interface and its metadata, Caveat for the handwritten captions. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Loaded WITHOUT blocking the first paint.

     A stylesheet in the head stops the page rendering until it has arrived,
     and this one comes from another company's server: a phone opening the
     gift over the shop's wifi waited on a round trip to fonts.googleapis.com
     before it was allowed to draw anything at all — measured at 1.6s of a
     3.0s first paint, and unbounded when that wifi has no way out to the
     internet. `media=print` makes it non-blocking; the onload switch applies
     it the moment it lands. The families, weights and `display=swap` are
     unchanged, so the type that arrives is the same type as before. -->
<link id="webfonts" media="print"
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300;1,400;1,500&family=Jost:wght@200;300;400;500&display=swap"
      rel="stylesheet">
<!-- The switch lives in a script element, not in an onload ATTRIBUTE: this
     application's own Content-Security-Policy sets `script-src-attr 'none'`,
     which blocks inline handlers outright, and an attribute that never runs is
     a stylesheet that stays `media=print` and type that never arrives. -->
<script>
  (function () {
    var l = document.getElementById('webfonts');
    if (!l) return;
    var apply = function () { l.media = 'all'; };
    if (l.sheet) apply(); else l.addEventListener('load', apply, { once: true });
  })();
</script>
